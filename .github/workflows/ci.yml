name: CI

on:
  push:
    branches: [master]
  pull_request:

# Permisos mínimos: el CI solo lee el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior que siga en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cada servicio es un módulo Go independiente (go.mod propio), así que lint y
  # tests corren una vez por módulo. La versión de Go sale del go.mod de cada uno.
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [orders-api, notifier-worker]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear:"; echo "$unformatted"; gofmt -d .; exit 1
          fi

      - name: go mod tidy no debe cambiar nada
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}

  # Los tests de integración levantan su propio PostgreSQL y Redis con
  # testcontainers; los runners de GitHub traen Docker. -race necesita cgo, que
  # en ubuntu-latest está disponible (en la máquina de desarrollo actual no).
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [orders-api, notifier-worker]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go test -race
        run: go test -race -count=1 -timeout 10m ./...

  # Manifiestos de Kubernetes: se renderizan con kustomize y se validan en modo
  # estricto contra los esquemas de la API de Kubernetes (la misma versión que
  # el nodo de kind). Es una validación estática: no crea ningún clúster.
  k8s:
    name: k8s (manifiestos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: orders-api/go.mod
          cache: false

      # go install verifica el módulo contra el sumdb de Go (integridad).
      - name: Instalar kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0

      - name: kustomize build
        run: kubectl kustomize k8s/ > "$RUNNER_TEMP/rendered.yaml"

      - name: kubeconform --strict
        run: kubeconform -strict -summary -kubernetes-version 1.36.0 "$RUNNER_TEMP/rendered.yaml"

  # Infraestructura como código: formato, validación y tests (con provider
  # simulado), y después el ciclo completo contra un LocalStack REAL levantado con
  # el mismo servicio del docker-compose.yml (misma imagen y versión fijada):
  # apply → sin cambios en un segundo plan → comprobación independiente con
  # awslocal → destroy.
  terraform:
    name: terraform (localstack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false # sin el envoltorio: stdout y códigos de salida intactos

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform test (provider simulado)
        run: terraform test

      - name: Levantar LocalStack
        run: docker compose -f ../docker-compose.yml up -d --wait localstack

      - name: terraform apply
        run: terraform apply -input=false -auto-approve

      - name: Un segundo plan no debe proponer cambios
        run: terraform plan -input=false -detailed-exitcode

      - name: El bucket existe con la configuración esperada (awslocal, independiente de Terraform)
        run: |
          d="docker compose -f ../docker-compose.yml exec -T localstack awslocal"
          $d s3 ls | grep -q outbox-receipts
          test "$($d s3api get-bucket-versioning --bucket outbox-receipts --query Status --output text)" = "Enabled"
          test "$($d s3api get-bucket-encryption --bucket outbox-receipts --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' --output text)" = "AES256"
          test "$($d s3api get-public-access-block --bucket outbox-receipts --query 'PublicAccessBlockConfiguration.BlockPublicAcls' --output text)" = "True"

      - name: terraform destroy
        run: terraform destroy -input=false -auto-approve

      - name: Logs de LocalStack (solo si falló)
        if: failure()
        run: docker compose -f ../docker-compose.yml logs --no-color localstack

      - name: Apagar
        if: always()
        run: docker compose -f ../docker-compose.yml down -v

  # Humo del stack completo: construye las imágenes, levanta todo con Compose,
  # comprueba el flujo pedido → outbox → notificación y que TODOS los
  # contenedores estén únicamente en la red outbox-net.
  compose:
    name: compose (stack completo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Construir y levantar el stack
        run: docker compose up -d --build --wait

      - name: Todos los contenedores están solo en outbox-net
        run: |
          fail=0
          for c in $(docker compose ps -a -q); do
            name="$(docker inspect -f '{{.Name}}' "$c")"
            nets="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$c")"
            echo "$name -> $nets"
            [ "$nets" = "outbox-net " ] || { echo "::error::$name no está solo en outbox-net"; fail=1; }
          done
          exit "$fail"

      - name: Un pedido produce una notificación
        run: |
          curl -fsS -X POST http://localhost:8081/orders \
            -H 'Content-Type: application/json' \
            -d '{"customer_email":"ci@example.com","currency":"USD","items":[{"sku":"SKU-1","quantity":2,"unit_price_cents":1500}]}'
          echo
          for i in $(seq 1 30); do
            if docker compose logs notifier-worker --no-log-prefix | grep -q "notificación enviada"; then
              echo "notificación recibida tras ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::no apareció la notificación en 30 s"; exit 1

      - name: Logs del stack (solo si falló)
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar y borrar el stack
        if: always()
        run: docker compose down -v
