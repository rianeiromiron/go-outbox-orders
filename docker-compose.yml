name: go-outbox-orders

# Stack completo: todos los componentes son nuevos y viven en UNA sola red
# aislada (outbox-net). No se reutiliza ningún contenedor, volumen ni red de
# otros proyectos; los nombres de volúmenes e imágenes llevan el prefijo del
# proyecto.
#
#   docker compose up -d --build --wait     (o: make up)
#
# Solo se publican en el host, y únicamente en 127.0.0.1, los puertos que sirven
# para probar desde fuera: 5433 (postgres), 6380 (redis), 8081 (orders-api) y
# 4567 (localstack).
# Entre contenedores todo se habla por nombre de servicio dentro de outbox-net.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders # solo desarrollo local
      POSTGRES_DB: orders
    ports:
      - "127.0.0.1:5433:5432" # 5433 en el host para no chocar con otros Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - outbox-net

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379" # 6380 en el host para no chocar con otros Redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - outbox-net

  # AWS simulado (solo S3) para practicar infraestructura como código con
  # Terraform (ver terraform/). Instancia NUEVA de este proyecto, sin relación con
  # ningún LocalStack de otros proyectos.
  #
  # VERSIÓN FIJADA A PROPÓSITO: 4.14.0 (feb 2026) es la última versión que arranca
  # sin cuenta ni token. Desde 2026.03 (versionado por calendario, p. ej. 2026.8.3)
  # la imagen sale con "License activation failed" (código 55) si no hay
  # LOCALSTACK_AUTH_TOKEN. No la actualices sin decidir cómo gestionar ese token.
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
    ports:
      - "127.0.0.1:4567:4566" # 4567 en el host: el 4566 lo usa otro proyecto
    # La imagen declara un VOLUME anónimo en /var/lib/localstack; sin esto, cada
    # `down` + `up` dejaría un volumen huérfano más. El estado de LocalStack es
    # efímero a propósito (Terraform lo recrea), así que va en memoria.
    tmpfs:
      - /var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -Eq '\"s3\": \"(available|running)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - outbox-net

  # Job de una sola ejecución: aplica las migraciones y termina. La API y el
  # worker esperan a que termine bien (service_completed_successfully).
  migrate:
    build: ./orders-api
    image: go-outbox-orders/orders-api:dev
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - outbox-net

  orders-api:
    build: ./orders-api
    image: go-outbox-orders/orders-api:dev
    environment:
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      HTTP_ADDR: ":8080"
      ENABLE_TEST_UI: "true" # página de prueba en http://localhost:8081/ui/ (solo desarrollo; apagada por defecto)
    ports:
      - "127.0.0.1:8081:8080" # 8081 en el host (8080 lo usan otros proyectos)
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /readyz comprueba la conexión a la base de datos; wget viene con busybox.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - outbox-net

  notifier-worker:
    build: ./notifier-worker
    image: go-outbox-orders/notifier-worker:dev
    environment:
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders?sslmode=disable
      REDIS_ADDR: redis:6379
      HEALTH_ADDR: ":8080" # sondas /healthz y /readyz; no se publican en el host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /readyz comprueba Postgres y Redis; wget viene con busybox.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 20s # margen sobre el apagado ordenado (lote en curso + tareas activas)
    restart: unless-stopped
    networks:
      - outbox-net

# Red propia y aislada: no se reutiliza ninguna red de otros proyectos, no hay
# `external: true` y ningún servicio usa la red `default`.
networks:
  outbox-net:
    name: outbox-net
    driver: bridge

volumes:
  postgres-data:
  redis-data:
