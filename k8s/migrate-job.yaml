# Job de una sola ejecución: aplica las migraciones (goose, idempotentes) y termina.
# La API y el worker esperan a que el esquema exista con un initContainer.
#
# Un Job es inmutable una vez creado: si cambia su spec hay que borrarlo antes de
# volver a aplicar (`make k8s-up` ya lo hace).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: outbox
  labels:
    app.kubernetes.io/name: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # UID numérico: la imagen declara `USER app` (nombre) y el kubelet no puede verificar un nombre
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          # -U/-d explícitos: el contenedor corre como UID 10001, que no existe en
          # /etc/passwd, y sin -U pg_isready no puede deducir el usuario y responde
          # "no attempt" sin siquiera conectar.
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U orders -d orders; do echo 'esperando a postgres...'; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          image: go-outbox-orders/orders-api:dev
          imagePullPolicy: IfNotPresent # la imagen se carga en el clúster con `kind load`
          command: ["/app/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
