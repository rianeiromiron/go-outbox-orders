apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: outbox
  labels:
    app.kubernetes.io/name: orders-api
spec:
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: outbox
  labels:
    app.kubernetes.io/name: orders-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # nunca quedarse sin réplicas listas durante un despliegue
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
    spec:
      terminationGracePeriodSeconds: 30 # la API espera hasta 15 s a las peticiones en curso
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # UID numérico: la imagen declara `USER app` (nombre) y el kubelet no puede verificar un nombre
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # No arranca hasta que el Job de migración haya creado el esquema.
        - name: wait-for-schema
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until [ "$(psql "$DATABASE_URL" -tAc "SELECT to_regclass('public.outbox_events') IS NOT NULL" 2>/dev/null)" = "t" ]; do
                echo "esperando a las migraciones..."; sleep 2
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: orders-api
          image: go-outbox-orders/orders-api:dev
          imagePullPolicy: IfNotPresent # la imagen se carga en el clúster con `kind load`
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            - name: HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: outbox-config
                  key: HTTP_ADDR
          readinessProbe:
            httpGet:
              path: /readyz # incluye la conexión a la base de datos
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz # solo el proceso: una BD caída no debe reiniciar la API
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
