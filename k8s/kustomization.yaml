apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# `kubectl apply -k k8s/` (o `make k8s-up`). El orden lo garantizan los
# initContainers, no el orden de esta lista.
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - migrate-job.yaml
  - orders-api.yaml
  - notifier-worker.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: go-outbox-orders
    includeSelectors: false # solo metadatos; no cambia los selectores (inmutables)
